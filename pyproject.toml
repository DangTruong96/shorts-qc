[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-qc"
version = "0.2.0"
description = "Quality gates for AI-generated short-form video: loudness, dead air, white-edge panels, black/frozen frames, caption fit, narration language."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "DangTruong96" },
]
keywords = ["video", "ffmpeg", "qc", "shorts", "youtube", "tts"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
language = ["faster-whisper"]

[project.scripts]
shorts-qc = "shorts_qc:main"

[project.urls]
Homepage = "https://github.com/DangTruong96/shorts-qc"

[tool.setuptools]
py-modules = ["shorts_qc"]
